name: CI

# Minimal build gate (audit finding — no CI existed at all, so a lint/type/build regression
# only surfaced if whoever pushed happened to run these locally first). Deliberately not a full
# test suite — there isn't one yet (separate, bigger item) — just the two checks that were
# already being run by hand every session: typecheck and production build.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # TypeScript isn't a project devDependency yet (see TODO.md) — `npm exec --yes` fetches
        # it on the fly, same command used for local verification throughout this project.
        # The pre-existing backlog (peaked at 57 errors — categories A/B/C, see TODO.md history)
        # is fully cleared as of this workflow revision, so this now fails on any tsc error
        # rather than ratcheting a baseline down.
        run: npm exec --yes --package typescript -- tsc --noEmit -p .

      - name: Build
        run: npm run build
